
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GroupSeg | Links Oficiais</title>
    <meta name="theme-color" content="#171747">
    <meta name="description" content="Acesse os canais oficiais da GroupSeg.">

    <!-- Logo e favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo.jpg">
    <link rel="apple-touch-icon" href="assets/images/logo.jpg">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #171747;
            --navy-light: #29295f;
            --gray: #858585;
            --gray-light: #e9e9ed;
            --white: #ffffff;
            --black: #171717;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 30px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', Arial, sans-serif;
            color: var(--white);
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(133, 133, 133, 0.22),
                    transparent 40%
                ),
                linear-gradient(145deg, #10102f, #202044 55%, #11111c);
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: auto;
            text-align: center;
        }

        .logo-area {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .profile {
            display: block;
            width: 190px;
            max-width: 65%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.18));
        }

        .brand-name {
            font-size: 28px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--white);
            margin-bottom: 10px;
        }

        .brand-name span {
            color: #a7a7aa;
        }

        .bio {
            font-size: 14px;
            line-height: 1.6;
            color: #d0d0d8;
            margin-bottom: 28px;
        }

        .divider {
            width: 48px;
            height: 3px;
            margin: 0 auto 25px;
            background: var(--gray);
            border-radius: 10px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            min-height: 58px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;

            background: var(--white);
            color: var(--navy);
            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition:
                transform 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: var(--navy-light);
            color: var(--white);
            border-color: #7777a5;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
        }

        .icon {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .footer {
            margin-top: 35px;
            color: #a7a7b4;
            font-size: 11px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .footer strong {
            color: var(--white);
            font-weight: 700;
        }

        @media (max-width: 480px) {
            body {
                padding: 28px 20px;
            }

            .container {
                max-width: 380px;
            }

            .profile {
                width: 170px;
            }

            .brand-name {
                font-size: 25px;
            }

            .link-btn {
                min-height: 56px;
                font-size: 14px;
                border-radius: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <!-- Logo da GroupSeg -->
        <div class="logo-area">
            <img
                src="assets/images/logo.jpg"
                alt="Logo GroupSeg"
                class="profile"
                width="190"
            >
        </div>

        <h1 class="brand-name">
            GROUP<span>SEG</span>
        </h1>

        <p class="bio">
            Segurança e confiança em um só lugar.<br>
            Acesse nossos canais oficiais.
        </p>

        <div class="divider"></div>

        <nav class="links" aria-label="Links oficiais da GroupSeg">

            <!-- Instagram -->

            >

                    <path d="M7.05.07C8.33.01 8.74 0 12 0s3.67.01 4.95.07c4.35.2 6.78 2.62 6.98 6.98.06 1.28.07 1.69.07 4.95s-.01 3.67-.07 4.95c-.2 4.35-2.63 6.78-6.98 6.98-1.28.06-1.69.07-4.95.07s-3.67-.01-4.95-.07c-4.36-.2-6.78-2.63-6.98-6.98C.01 15.67 0 15.26 0 12s.01-3.67.07-4.95C.27 2.69 2.69.27 7.05.07ZM12 2.16c-3.2 0-3.58.01-4.85.07-3.25.15-4.77 1.69-4.92 4.92-.06 1.26-.07 1.64-.07 4.85s.01 3.58.07 4.85c.15 3.22 1.66 4.77 4.92 4.92 1.26.06 1.64.07 4.85.07s3.58-.01 4.85-.07c3.25-.15 4.77-1.7 4.92-4.92.06-1.27.07-1.65.07-4.85s-.01-3.59-.07-4.85c-.15-3.23-1.67-4.77-4.92-4.92-1.27-.06-1.65-.07-4.85-.07Zm0 3.68a6.16 6.16 0 1 1 0 12.32 6.16 6.16 0 0 1 0-12.32Zm0 2a4.16 4.16 0 1 0 0 8.32 4.16 4.16 0 0 0 0-8.32Zm6.41-3.69a1.44 1.44 0 1 1 0 2.88 1.44 1.44 0 0 1 0-2.88Z"/>
                </svg>

            </a>

        </nav>

        <footer class="footer">
            <strong>GROUPSEG</strong> · Todos os direitos reservados
        </footer>

    </main>
</body>
</html>
